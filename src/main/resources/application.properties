spring.application.name=virtual-thread-demo

# Run with virtual threads unless another profile is chosen.
# Switch with: ./mvnw spring-boot:run -Dspring-boot.run.profiles=platform
spring.profiles.default=virtual

# How long GET /thread blocks, simulating a slow database or remote call.
demo.blocking-delay=2s

# Actuator: expose JVM thread metrics, e.g. /actuator/metrics/jvm.threads.live
management.endpoints.web.exposure.include=health,info,metrics

# Let the OS queue up to 1000 pending connections so load tests measure thread
# behaviour, not refused connections (Tomcat's default is 100).
server.tomcat.accept-count=1000
